name: Nightly fuzz

on:
  schedule:
    - cron: "17 3 * * *" # every night, 03:17 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per target
        default: 5m

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - id: list
        name: List Fuzz* targets
        run: |
          entries=()
          for pkg in $(go list ./...); do
            for t in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              entries+=("{\"pkg\":\"$pkg\",\"target\":\"$t\"}")
            done
          done
          echo "matrix={\"include\":[$(IFS=,; echo "${entries[*]}")]}" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Fuzz
        run: go test -run '^$' -fuzz "^${{ matrix.target }}$" -fuzztime "${{ inputs.fuzztime || '5m' }}" "${{ matrix.pkg }}"
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: "**/testdata/fuzz/${{ matrix.target }}/**"
