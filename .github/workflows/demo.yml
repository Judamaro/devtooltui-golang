name: Demo

# Run manually: records docs/demo.gif with VHS and commits it.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: make build # the tape runs bin/devtooltui
      - uses: charmbracelet/vhs-action@v2
        with:
          path: docs/demo.tape
      - name: Commit the GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          git diff --cached --quiet || git commit -m "docs: update demo gif"
          git push
